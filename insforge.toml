[auth]
allowed_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/sign-in",
  "http://localhost:3000/sign-up",
  "http://localhost:3000/reset-password",
  "http://127.0.0.1:3000",
  "https://m5294326.insforge.site",
  "https://m5294326.insforge.site/auth/callback",
  "https://m5294326.insforge.site/sign-in",
  "https://m5294326.insforge.site/sign-up",
  "https://m5294326.insforge.site/reset-password",
  "https://m5294326.insforge.site/forgot-password"
]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = false

[auth.password]
min_length = 6
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 50

[realtime]
retention_days = 0

[schedules]
retention_days = 7
